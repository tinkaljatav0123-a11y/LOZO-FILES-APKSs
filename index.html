<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOZO FILES + APKS</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      text-align: center;
      padding: 30px 15px;
      background: #1c1c1c;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      color: #bbb;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .file-card {
      background: #202020;
      padding: 22px;
      margin: 20px 0;
      border-radius: 15px;
      text-align: center;
    }

    .file-card h2 {
      margin-top: 0;
    }

    .ad {
      background: #333;
      padding: 18px;
      margin: 15px 0;
      border-radius: 10px;
      color: #aaa;
    }

    .timer {
      margin: 15px 0;
      font-size: 18px;
      color: #00e676;
    }

    .download {
      display: inline-block;
      background: #00c853;
      color: white;
      padding: 13px 25px;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .download:disabled {
      background: #555;
      cursor: not-allowed;
    }
  </style></head><body><header>
  <h1>LOZO FILES + APKS</h1>
  <p>APK & ZIP Download Center</p>
</header><div class="container">  <!-- APK -->  <div class="file-card">
    <h2>Example APK</h2>
    <p>Download APK file</p><div class="ad">ADVERTISEMENT</div>
<div class="ad">ADVERTISEMENT</div>
<div class="ad">ADVERTISEMENT</div>

<div class="timer" id="apkTimer">
  15 seconds remaining
</div>

<button class="download" id="apkButton" disabled>
  Please wait...
</button>

  </div>  <!-- ZIP -->  <div class="file-card">
    <h2>Example ZIP</h2>
    <p>Download ZIP file</p><div class="ad">ADVERTISEMENT</div>
<div class="ad">ADVERTISEMENT</div>
<div class="ad">ADVERTISEMENT</div>

<div class="timer" id="zipTimer">
  15 seconds remaining
</div>

<button class="download" id="zipButton" disabled>
  Please wait...
</button>

  </div></div><script>

  function startTimer(timerId, buttonId, fileLink) {

    let seconds = 15;

    const timer = document.getElementById(timerId);
    const button = document.getElementById(buttonId);

    const countdown = setInterval(function () {

      seconds--;

      timer.textContent = seconds + " seconds remaining";

      if (seconds <= 0) {

        clearInterval(countdown);

        timer.textContent = "Ready to download!";

        button.disabled = false;
        button.textContent = "DOWNLOAD";

        button.onclick = function () {
          window.location.href = fileLink;
        };

      }

    }, 1000);
  }


  /*
    IMPORTANT:
    Neeche apni actual file ke naam lagana.

    Example:
    files/example.apk
    files/example.zip
  */

  startTimer(
    "apkTimer",
    "apkButton",
    "files/example.apk"
  );

  startTimer(
    "zipTimer",
    "zipButton",
    "files/example.zip"
  );

</script></body>
</html>
