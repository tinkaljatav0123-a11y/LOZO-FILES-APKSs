<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOZO Admin</title>
<style>body{font-family:Arial;background:#f4f6f9;margin:0}.wrap{max-width:650px;margin:35px auto;padding:20px}.card{background:white;padding:22px;border-radius:16px;box-shadow:0 5px 20px #0001}input{width:100%;padding:12px;margin:8px 0 15px;box-sizing:border-box}.btn{padding:12px 18px;border:0;border-radius:9px;background:#111827;color:white;font-weight:700}small{color:#667085}</style></head>
<body><div class="wrap"><div class="card"><h1>LOZO FILES + APKS</h1><h2>Admin Upload</h2>
<p>This starter is a frontend demo. A real upload system needs a backend/storage provider.</p>
<label>File</label><input type="file" id="file">
<label>Unique File ID</label><input id="fid" placeholder="apk-001"><label>Public file URL</label><input id="url" placeholder="https://your-storage.example/file.apk">
<button class="btn" onclick="show()">Add file</button><p id="out"></p>
<hr><small>For production: protect this page with authentication and store files in object storage. Do not put admin secrets in frontend JavaScript.</small></div></div>
<script>function show(){let f=document.getElementById('file').files[0],u=document.getElementById('url').value;let id=document.getElementById("fid").value.trim();if(!f||!u||!id){out.textContent="Select a file, enter a unique ID and enter its public URL.";return}out.textContent="Demo entry ready: "+f.name+" → "+u+" | ID: "+id+" | This ID gets its own link and counter. Copy it into index.html."}</script>
</body></html>
